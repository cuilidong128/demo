# Application properties
server:
  port: 8080

# 激活开发环境配置
spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/crmeb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: aA123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      pool-name: HikariCP-Pool
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      initialization-fail-timeout: 1

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  # 指定Mapper XML文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.example.demo.entity

# JWT配置
jwt:
  secret: mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnoughAndSecure123456
  access-token-expiration: 3600000    # 1小时 (毫秒)
  refresh-token-expiration: 86400000  # 24小时 (毫秒)

# Redis配置
  redis:
    host: localhost
    port: 6379
    password: # 如果有密码请填写
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
    timeout: 5000ms

# 验证码配置
captcha:
  expire-time: 300  # 验证码过期时间（秒）
  width: 120        # 验证码图片宽度
  height: 40        # 验证码图片高度
  length: 4         # 验证码字符长度

# 文件上传配置
upload:
  # 本地上传配置
  local:
    enabled: true
    # 上传路径（使用绝对路径，避免相对路径问题）
    path: /Users/cuilidong/Desktop/demo/uploads
    # 访问URL前缀
    url-prefix: http://localhost:8080/uploads
  # 阿里云OSS配置
  oss:
    enabled: false
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket-name
    # 访问URL前缀（CDN域名或Bucket域名）
    url-prefix: https://your-bucket.oss-cn-hangzhou.aliyuncs.com
